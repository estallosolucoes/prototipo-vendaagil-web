</helmet>
<div data-screen-label="REL-01 Hub de relatórios" style="min-height:100vh;background:#F2F4F7;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#021226;display:flex;flex-direction:column">
<dc-import name="Topbar" hint-size="100%,92px"></dc-import>
<div style="position:relative;flex:1">
<dc-import name="Sidebar" active="relatorios" hint-size="0px,0px"></dc-import>
<main style="max-width:1280px;margin:0 auto;padding:44px 32px 56px 120px;width:100%">
<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:24px">
<h1 style="font:600 24px/1.25 'IBM Plex Sans';letter-spacing:-.01em;margin:0">Relatórios</h1>
<span style="font:400 14px/1.55 'IBM Plex Sans';color:#454F5E">Todos abrem com filtros de período, representada e vendedor</span>
</div>
<div style="display:grid;grid-template-columns:var(--va-g3,1fr 1fr 1fr);gap:16px">
<sc-for list="{{ grupos }}" as="g" hint-placeholder-count="6">
<div style="background:#FFFFFF;border-radius:10px;box-shadow:0 1px 2px rgba(2,18,38,.06);padding:20px;display:flex;flex-direction:column;gap:10px">
<span style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px;border-radius:6px;background:#EDF0F5;color:#454F5E;display:grid;place-items:center"><i data-lucide="{{ g.icone }}" style="font-size:17px"></i></span><span style="font:600 15px/1.3 'IBM Plex Sans'">{{ g.nome }}</span></span>
<div style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ g.itens }}" as="r" hint-placeholder-count="3">
<a href="{{ r.href }}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;text-decoration:none;color:#021226;font:400 13.5px/1.4 'IBM Plex Sans'" style-hover="background:#EDF0F5"><span>{{ r.nome }}</span><i data-lucide="chevron-right" style="font-size:14px;color:#7A8699"></i></a>
</sc-for>
</div>
</div>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { this.paint(); }
  componentDidUpdate() { this.paint(); }
  paint() {
    if (!window.lucide) { setTimeout(() => this.paint(), 120); return; }
    try { window.lucide.createIcons({ nameAttr: 'data-lucide' }); } catch (e) {}
  }
  renderVals() {
    return {
      grupos: [
        { nome: 'Vendas', icone: 'clipboard-list', itens: [
          { nome: 'Venda geral', id: 'venda-geral' }, { nome: 'Venda por cliente — Curva ABC', id: 'abc-clientes' },
          { nome: 'Venda por produto — Curva ABC', id: 'abc-produtos' }, { nome: 'Produtos mais vendidos', id: 'mais-vendidos' },
          { nome: 'Produtos menos vendidos', id: 'menos-vendidos' } ] },
        { nome: 'Clientes', icone: 'users', itens: [
          { nome: 'Clientes positivados', id: 'positivados' }, { nome: 'Clientes inativos', id: 'inativos' },
          { nome: 'Situação da carteira', id: 'carteira' } ] },
        { nome: 'Comissões', icone: 'receipt', itens: [
          { nome: 'Comissões recebidas', id: 'com-recebidas' }, { nome: 'Comissões pendentes', id: 'com-pendentes' },
          { nome: 'Comissões previstas', id: 'com-previstas' } ] },
        { nome: 'Faturamento', icone: 'file-text', itens: [
          { nome: 'Pedidos faturados', id: 'faturados' }, { nome: 'Corte de pedido por representada', id: 'cortes' } ] },
        { nome: 'Financeiro', icone: 'hand-coins', itens: [{ nome: 'Cobranças', id: 'cobrancas' }, { nome: 'Fluxo de caixa previsto', id: 'fluxo-caixa' }, { nome: 'Despesas da representação', id: 'despesas' }] },
        { nome: 'CRM', icone: 'kanban', itens: [
          { nome: 'Motivos de perda', id: 'crm-funil' }, { nome: 'Total de negócios', id: 'crm-total' },
          { nome: 'Negócios em aberto', id: 'crm-abertos' }, { nome: 'Tempo médio de atendimento', id: 'crm-tempo' } ] },
      ].map(g => ({ ...g, itens: g.itens.map(r => ({ ...r, href: 'relatorio.dc.html?r=' + r.id })) })),
    };
  }
}
</script>
