<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { buscando: false, buscou: false };
  componentDidMount() { this.paint(); }
  componentDidUpdate() { this.paint(); }
  paint() {
    if (!window.lucide) { setTimeout(() => this.paint(), 120); return; }
    try { window.lucide.createIcons({ nameAttr: 'data-lucide' }); } catch (e) {}
  }
  renderVals() {
    const b = this.state.buscou;
    return {
      btnProps: { style: { color: '#F3F3F3' } },
      buscando: this.state.buscando,
      buscou: b,
      cnpj: '07.334.816/0001-20',
      razao: b ? 'Expresso Serrano Transportes Ltda' : '',
      fantasia: b ? 'Expresso Serrano' : '',
      ie: b ? '029/4471203' : '',
      rntrc: b ? '00412876' : '',
      cep: b ? '95012-580' : '',
      endereco: b ? 'Rodovia RSC-453, km 92' : '',
      numero: b ? 's/n' : '',
      bairro: b ? 'Distrito Industrial' : '',
      cidade: b ? 'Caxias do Sul' : '',
      uf: b ? 'RS' : '',
      buscarCnpj: () => {
        this.setState({ buscando: true });
        setTimeout(() => this.setState({ buscando: false, buscou: true }), 900);
      },
      voltar: () => { location.href = 'transportadoras.dc.html'; },
    };
  }
}
</script>
