<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { count: 0 };
  componentDidMount() { this.paint(); }
  componentDidUpdate() { this.paint(); }
  paint() {
    if (!window.lucide) { setTimeout(() => this.paint(), 120); return; }
    try { window.lucide.createIcons({ nameAttr: 'data-lucide' }); } catch (e) {}
  }
  renderVals() {
    const c = this.state.count;
    return {
      waiting: c > 0,
      reenviarLabel: c > 0 ? 'Reenviado — aguarde ' + c + 's' : 'Reenviar e-mail',
      reenviar: () => {
        this.setState({ count: 30 });
        const t = setInterval(() => {
          this.setState(s => {
            if (s.count <= 1) { clearInterval(t); return { count: 0 }; }
            return { count: s.count - 1 };
          });
        }, 1000);
      },
    };
  }
}
</script>
