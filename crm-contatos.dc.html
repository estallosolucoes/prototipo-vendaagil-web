<div data-screen-label="CRM-02 Contatos" style="min-height:100vh;background:#F2F4F7;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#021226;display:flex;flex-direction:column">

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { busca: '', formOpen: false, edit: null };
  componentDidMount() { this.paint(); }
  componentDidUpdate() { this.paint(); }
  paint() {
    if (!window.lucide) { setTimeout(() => this.paint(), 120); return; }
    try { window.lucide.createIcons({ nameAttr: 'data-lucide' }); } catch (e) {}
  }
  renderVals() {
    const defs = [
      { iniciais: 'MF', nome: 'Márcia Fontana', email: 'marcia.fontana@saojorge.com.br', empresa: 'Depósito São Jorge', papel: 'Comprador', fone: '(54) 99204-8871', ultimo: 'hoje, pelo catálogo' },
      { iniciais: 'PS', nome: 'Paulo Siqueira', email: 'compras@casaelar.com.br', empresa: 'Casa & Lar Móveis', papel: 'Comprador', fone: '(51) 99811-2304', ultimo: 'ontem, WhatsApp' },
      { iniciais: 'RC', nome: 'Renata Cruz', email: 'renata@pinheiral.com.br', empresa: 'Lojas Pinheiral', papel: 'Gerente de loja', fone: '(51) 98122-7745', ultimo: '04/08, visita' },
      { iniciais: 'AM', nome: 'Ana Beatriz Melo', email: 'ana.melo@cvitoria.com.br', empresa: 'Comercial Vitória', papel: 'Comprador', fone: '(54) 99377-1208', ultimo: '04/08, WhatsApp' },
      { iniciais: 'JT', nome: 'Jorge Tanaka', email: 'jorge@guarani.com.br', empresa: 'Móveis Guarani', papel: 'Dono', fone: '(54) 98420-6633', ultimo: '01/08, telefone' },
      { iniciais: 'SB', nome: 'Sérgio Baltazar', email: 'sergio@baltazar.com.br', empresa: 'Móveis Baltazar', papel: 'Dono', fone: '(54) 99655-0917', ultimo: '28/07, visita' },
      { iniciais: 'CF', nome: 'Cláudia Ferraz', email: 'financeiro@saojorge.com.br', empresa: 'Depósito São Jorge', papel: 'Financeiro', fone: '(54) 3221-4890', ultimo: '25/07, e-mail' },
    ];
    const q = this.state.busca.trim().toLowerCase();
    return {
      btnProps: { style: { color: '#F3F3F3' } },
      busca: this.state.busca,
      setBusca: (v) => this.setState({ busca: typeof v === 'string' ? v : v.target.value }),
      formOpen: this.state.formOpen,
      formTitulo: this.state.edit ? 'Editar contato' : 'Cadastrar contato',
      formNome: this.state.edit ? this.state.edit.nome : '',
      abrirNovo: () => this.setState({ formOpen: true, edit: null }),
      fechar: () => this.setState({ formOpen: false }),
      contatos: defs
        .filter(c => !q || c.nome.toLowerCase().includes(q) || c.empresa.toLowerCase().includes(q) || c.fone.includes(q))
        .map(c => ({
          ...c,
          abrirFicha: () => { location.href = 'crm-contato-detalhe.dc.html'; },
          editar: (e) => { e.stopPropagation(); this.setState({ formOpen: true, edit: c }); },
        })),
    };
  }
}
</script>
